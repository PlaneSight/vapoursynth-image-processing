[package]
name = "vs-defect-vapoursynth"
description = "VapourSynth runtime adapter for Defect"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vapoursynth.workspace = true
vs-defect = { path = "../../plugins/defect" }
vsip-core.workspace = true
vsip-vapoursynth.workspace = true

[lints.rust]
# The upstream export macro owns the VapourSynth ABI unsafe expansion. Adapter
# source contains no handwritten unsafe code.
unsafe_code = "allow"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
clone_on_ref_ptr = "deny"
undocumented_unsafe_blocks = "deny"
