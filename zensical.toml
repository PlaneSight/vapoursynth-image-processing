[project]
site_name = "VapourSynth Image Processing"
site_description = "High-quality Rust image-processing filters for VapourSynth."
site_author = "PlaneSight"
site_url = "https://planesight.github.io/vapoursynth-image-processing/"
repo_url = "https://github.com/PlaneSight/vapoursynth-image-processing"
repo_name = "PlaneSight/vapoursynth-image-processing"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "Copyright &copy; 2026 PlaneSight"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Using VSIP" = [
    { "CLI reference" = "cli.md" },
    { "Filter catalogue" = "filter-catalog.md" },
    { "VapourSynth runtime" = "vapoursynth.md" },
  ] },
  { "Project" = [
    { "Architecture" = "architecture.md" },
    { "Development" = "development.md" },
    { "Roadmap" = "roadmap.md" },
    { "Artifact lifecycle" = "artifacts.md" },
  ] },
  { "GitHub" = "https://github.com/PlaneSight/vapoursynth-image-processing" },
]

[project.theme]
variant = "modern"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue grey"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue grey"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/PlaneSight/vapoursynth-image-processing"
name = "VSIP on GitHub"
