name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - run: cargo xtask check-tree
      - run: cargo fmt --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --release
      - run: cargo test --workspace --no-default-features
      - run: cargo doc --workspace --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Check pure algorithm MSRV
        run: >-
          cargo check --all-targets
          -p vsip-core
          -p vsip-kernels
          -p vsip-plugin-api
          -p vsip-test-support
          -p vs-masklab
          -p vs-defect
          -p vs-deconvolve
          -p vs-flowfield
          -p vs-grainlab
          -p vs-phase
          -p vs-edgeaware
          -p vs-register
          -p vs-lens
          -p vs-tonelab
          -p vs-residual
          -p vs-segment
          -p xtask
      - name: Test pure algorithms on MSRV
        run: >-
          cargo test
          -p vsip-core
          -p vsip-kernels
          -p vsip-plugin-api
          -p vsip-test-support
          -p vs-masklab
          -p vs-defect
          -p vs-deconvolve
          -p vs-flowfield
          -p vs-grainlab
          -p vs-phase
          -p vs-edgeaware
          -p vs-register
          -p vs-lens
          -p vs-tonelab
          -p vs-residual
          -p vs-segment
          -p xtask

  adapter-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --workspace --all-targets
