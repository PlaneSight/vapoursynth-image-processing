name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - run: uv sync --locked
      - run: uv run --locked vsip check
      - run: uv run --locked vsip test --profile release
      - run: uv run --locked vsip test --profile no-default
      - if: runner.os == 'Linux'
        run: uv run --locked vsip package

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Check pure algorithm MSRV
        run: >-
          cargo check --all-targets
          -p vsip-core
          -p vsip-kernels
          -p vsip-plugin-api
          -p vsip-test-support
          -p vs-masklab
          -p vs-defect
          -p vs-deconvolve
          -p vs-flowfield
          -p vs-grainlab
          -p vs-phase
          -p vs-edgeaware
          -p vs-register
          -p vs-lens
          -p vs-tonelab
          -p vs-residual
          -p vs-segment
          -p xtask
      - name: Test pure algorithms on MSRV
        run: >-
          cargo test
          -p vsip-core
          -p vsip-kernels
          -p vsip-plugin-api
          -p vsip-test-support
          -p vs-masklab
          -p vs-defect
          -p vs-deconvolve
          -p vs-flowfield
          -p vs-grainlab
          -p vs-phase
          -p vs-edgeaware
          -p vs-register
          -p vs-lens
          -p vs-tonelab
          -p vs-residual
          -p vs-segment
          -p xtask

  adapter-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --workspace --all-targets
