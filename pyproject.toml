[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project]
name = "vapoursynth-image-processing"
version = "0.1.0"
description = "Rust image-processing plugins for VapourSynth with unified development tooling"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["image processing", "video", "VapourSynth", "Rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
vsip = "vsip_tools.cli:main"

[project.urls]
Documentation = "https://planesight.github.io/vapoursynth-image-processing/"
Issues = "https://github.com/PlaneSight/vapoursynth-image-processing/issues"
Repository = "https://github.com/PlaneSight/vapoursynth-image-processing"

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "zensical>=0.0.21",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["dist", "site", "target"]

[tool.ruff.lint]
select = ["ARG", "B", "C4", "D", "E", "F", "I", "PERF", "PTH", "RUF", "SIM", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/python/**" = ["D"]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12.0,<0.13"

[tool.uv.build-backend]
module-name = "vsip_tools"
