[workspace]
members = [
  "crates/vsip-core",
  "crates/vsip-kernels",
  "crates/vsip-plugin-api",
  "crates/vsip-test-support",
  "plugins/*",
  "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PlaneSight/vapoursynth-image-processing"
authors = ["PlaneSight contributors"]

[workspace.dependencies]
vsip-core = { path = "crates/vsip-core" }
vsip-kernels = { path = "crates/vsip-kernels" }
vsip-plugin-api = { path = "crates/vsip-plugin-api" }
vsip-test-support = { path = "crates/vsip-test-support" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
clone_on_ref_ptr = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.bench]
debug = 1
lto = "thin"
